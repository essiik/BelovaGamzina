<!-- ================================================================== -->
<!-- СТРАНИЦА РЕГИСТРАЦИИ ИНТЕРНЕТ-МАГАЗИНА "LACY INTIMACY" (register.html) -->
<!-- ================================================================== -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- МЕТАДАННЫЕ И ПОДКЛЮЧЕНИЯ -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <!-- Подключение шрифта Nanum Myeongjo (запасной) -->
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        /* ========== 1. ПОДКЛЮЧЕНИЕ ШРИФТА JejuMyeongjo (локально) ========== */
        @font-face {
            font-family: 'JejuMyeongjo';
            src: url('/static/fonts/JejuMyeongjo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * {
            font-family: 'JejuMyeongjo', 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
        }

        /* ========== 2. БАЗОВЫЕ СТИЛИ ========== */
        body {
            background: white;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* ========== 3. ДЕКОРАТИВНЫЕ КРУГИ (КРУЖЕВО) ========== */
        /* Общий класс для всех кругов */
        .lace-circle {
            position: fixed;
            background-image: url('https://i.pinimg.com/originals/f1/69/3b/f1693b97f00b9b7441519a31ef37fcca.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 50%;
            pointer-events: none;   /* чтобы круги не мешали кликам по форме */
            z-index: 1;
        }
        /* Размеры и положение каждого круга (создают декоративный узор) */
        .lace-top-1 { width: 580px; height: 580px; top: -250px; left: -80px; }
        .lace-top-2 { width: 460px; height: 460px; top: -210px; left: 380px; z-index: 2; }
        .lace-top-3 { width: 380px; height: 380px; top: -175px; left: 740px; z-index: 3; }
        .lace-top-4 { width: 300px; height: 300px; top: -145px; left: 1040px; z-index: 4; }
        .lace-top-5 { width: 240px; height: 240px; top: -115px; left: 1280px; z-index: 5; }
        .lace-bottom-center { width: 320px; height: 320px; bottom: -120px; left: 65%; transform: translateX(-10%); z-index: 7; }
        .lace-bottom-right { width: 440px; height: 440px; bottom: -160px; right: -80px; z-index: 8; }

        /* ========== 4. КОНТЕЙНЕР ФОРМЫ ========== */
        .container {
            width: 100%;
            max-width: 560px;
            text-align: center;
            position: relative;
            z-index: 10;
            background: transparent;
            padding: 20px;
            margin: 220px auto 60px;   /* смещено вниз, чтобы не перекрывать круги */
        }
        main {
            width: 100%;
            display: flex;
            justify-content: center;
            flex: 1;
        }

        /* ========== 5. ЗАГОЛОВОК И ЧЁРНЫЙ БЛОК ========== */
        h1 {
            font-size: 32px;
            font-weight: 800;
            color: black;
            margin: 10px 0 15px;
            letter-spacing: 1px;
        }
        .black-box {
            background: black;
            padding: 18px 25px;
            margin: 0;
        }

        /* ========== 6. ЭЛЕМЕНТЫ ФОРМЫ ========== */
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: 700;
            margin-bottom: 5px;
            color: white;
            font-size: 15px;
        }
        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid white;
            padding: 8px 0 5px 0;
            font-size: 15px;
            color: white;
            outline: none;
            font-weight: 400;
        }
        /* Анимация фокуса — плавное изменение цвета границы */
        input:focus { border-bottom-color: #ccc; }
        input::placeholder { color: #aaa; font-weight: 400; }

        /* Кнопка отправки формы */
        button {
            width: 60%;
            background: black;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s, transform 0.05s;
            border-radius: 12px;
            margin: 20px auto 0;
            display: block;
        }
        button:hover { background: #333; }
        button:active { transform: scale(0.98); }   /* Эффект нажатия */

        /* ========== 7. FLASH-СООБЩЕНИЯ (С ИКОНКАМИ) ========== */
        .flash-messages { margin-bottom: 15px; }
        .flash {
            padding: 8px 12px;
            margin-bottom: 8px;
            font-size: 13px;
            text-align: left;
            border-radius: 4px;
            font-weight: 400;
        }
        .flash.success { background: #1e3a2f; color: #b9f6ca; border-left: 4px solid #4caf50; }
        .flash.error { background: #3a1e1e; color: #ffb3b3; border-left: 4px solid #f44336; }

        /* ========== 8. ПОДВАЛ (FOOTER) – ПРОЗРАЧНЫЙ, ЧТОБЫ ВИДЕТЬ КРУЖЕВО ========== */
        footer {
            text-align: center;
            padding: 20px 0 30px;
            margin-top: 40px;
            color: #1a1a1a;
            font-size: 12px;
            letter-spacing: 1px;
            width: 100%;
            background: transparent;  /* убираем белый фон */
            border-top: none;        /* убираем границу */
            position: relative;
            z-index: 10;
        }
        footer .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        footer .social-links a {
            color: #1a1a1a;
            font-size: 20px;
            transition: color 0.2s;
            text-decoration: none;
        }
        footer .social-links a:hover {
            color: #555;
            text-decoration: underline;   /* подчёркивание при наведении */
        }
        footer .contacts {
            margin-top: 10px;
            font-size: 12px;
            color: #444;
        }

        /* ========== 9. АДАПТИВНОСТЬ (МОБИЛЬНАЯ ВЕРСИЯ) ========== */
        @media (max-width: 700px) {
            .lace-top-1 { width: 400px; height: 400px; top: -180px; left: -60px; }
            .lace-top-2 { width: 310px; height: 310px; top: -150px; left: 240px; }
            .lace-top-3 { width: 250px; height: 250px; top: -125px; left: 470px; }
            .lace-top-4 { width: 200px; height: 200px; top: -100px; left: 660px; }
            .lace-top-5 { width: 160px; height: 160px; top: -80px; left: 800px; }
            .lace-bottom-center { width: 230px; height: 230px; bottom: -90px; left: 65%; transform: translateX(-10%); }
            .lace-bottom-right { width: 320px; height: 320px; bottom: -120px; right: -50px; }
            .container { max-width: 480px; margin-top: 160px; }
            .black-box { padding: 16px 20px; }
            footer { padding: 15px 0 20px; }
        }
        @media (max-width: 500px) {
            .lace-circle { display: none; }   /* на маленьких телефонах круги скрываем */
        }
    </style>
</head>
<body>
    <!-- Круги (кружево) – декоративный фон -->
    <div class="lace-circle lace-top-1"></div>
    <div class="lace-circle lace-top-2"></div>
    <div class="lace-circle lace-top-3"></div>
    <div class="lace-circle lace-top-4"></div>
    <div class="lace-circle lace-top-5"></div>
    <div class="lace-circle lace-bottom-center"></div>
    <div class="lace-circle lace-bottom-right"></div>

    <!-- ОСНОВНОЙ КОНТЕНТ (MAIN) -->
    <main>
        <div class="container">
            <!-- Заголовок страницы -->
            <h1>РЕГИСТРАЦИЯ</h1>

            <!-- Чёрный блок с формой и flash-сообщениями -->
            <div class="black-box">
                <!-- Блок для вывода flash-сообщений (серверные уведомления) -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        <div class="flash-messages">
                            {% for category, message in messages %}
                                <!-- Сообщения выводятся с иконками (через текст, но можно добавить font-awesome) -->
                                <div class="flash {{ category }}">{{ message }}</div>
                            {% endfor %}
                        </div>
                    {% endif %}
                {% endwith %}

                <!-- Форма регистрации, отправляется методом POST на /register -->
                <form action="/register" method="post" id="register-form">
                    <div class="form-group">
                        <label for="username">Имя пользователя</label>
                        <input type="text" id="username" name="username" placeholder="Введите имя" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Почта</label>
                        <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" name="password" placeholder="Не менее 6 символов" required>
                    </div>
                </form>
            </div>

            <!-- Кнопка отправки формы (вынесена отдельно, но связана с формой через атрибут form) -->
            <button type="submit" form="register-form">Создать аккаунт</button>
        </div>
    </main>

    <!-- ПОДВАЛ (FOOTER) – единый для всего сайта -->
    <footer>
        <div class="social-links">
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="Telegram"><i class="fab fa-telegram-plane"></i></a>
            <a href="#" aria-label="VK"><i class="fab fa-vk"></i></a>
        </div>
        <div class="contacts">
            📧 support@lacyintimacy.com | 📞 +7 (900) 699 95 15
        </div>
        <p>© 2025 LACY INTIMACY. ALL RIGHTS RESERVED.</p>
    </footer>
</body>
</html>
