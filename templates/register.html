<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'JejuMyeongjo';
            src: url('/static/fonts/JejuMyeongjo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * {
            font-family: 'JejuMyeongjo', 'Nanum Myeongjo', 'Apple SD Gothic Neo', serif;
        }
        body {
            background: white;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Круги */
        .lace-circle {
            position: fixed;
            background-image: url('https://i.pinimg.com/originals/f1/69/3b/f1693b97f00b9b7441519a31ef37fcca.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
        }
        /* Верхние круги (5 штук) */
        .lace-top-1 { width: 580px; height: 580px; top: -250px; left: -80px; }
        .lace-top-2 { width: 460px; height: 460px; top: -210px; left: 380px; z-index: 2; }
        .lace-top-3 { width: 380px; height: 380px; top: -175px; left: 740px; z-index: 3; }
        .lace-top-4 { width: 300px; height: 300px; top: -145px; left: 1040px; z-index: 4; }
        .lace-top-5 { width: 240px; height: 240px; top: -115px; left: 1280px; z-index: 5; }
        /* Нижние круги (2 штуки) */
        .lace-bottom-center { width: 320px; height: 320px; bottom: -120px; left: 65%; transform: translateX(-10%); z-index: 7; }
        .lace-bottom-right { width: 440px; height: 440px; bottom: -160px; right: -80px; z-index: 8; }
        /* Форма */
        .container {
            width: 100%;
            max-width: 560px;
            text-align: center;
            position: relative;
            z-index: 10;
            background: transparent;
            padding: 20px;
            margin-top: 60px;
        }
        h1 { font-size: 32px; font-weight: 800; color: black; margin: 10px 0 15px; letter-spacing: 1px; }
        .black-box { background: black; padding: 18px 25px; margin: 0; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-weight: 700; margin-bottom: 5px; color: white; font-size: 15px; }
        input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid white;
            padding: 8px 0 5px 0;
            font-size: 15px;
            color: white;
            outline: none;
            font-weight: 400;
        }
        input:focus { border-bottom-color: #ccc; }
        input::placeholder { color: #aaa; font-weight: 400; }
        button {
            width: 60%;
            background: black;
            color: white;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 12px;
            margin: 20px auto 0;
            display: block;
        }
        button:hover { background: #333; }
        .flash-messages { margin-bottom: 15px; }
        .flash { padding: 8px 12px; margin-bottom: 8px; font-size: 13px; text-align: left; border-radius: 4px; font-weight: 400; }
        .flash.success { background: #1e3a2f; color: #b9f6ca; border-left: 4px solid #4caf50; }
        .flash.error { background: #3a1e1e; color: #ffb3b3; border-left: 4px solid #f44336; }
        @media (max-width: 700px) {
            .lace-top-1 { width: 400px; height: 400px; top: -180px; left: -60px; }
            .lace-top-2 { width: 310px; height: 310px; top: -150px; left: 240px; }
            .lace-top-3 { width: 250px; height: 250px; top: -125px; left: 470px; }
            .lace-top-4 { width: 200px; height: 200px; top: -100px; left: 660px; }
            .lace-top-5 { width: 160px; height: 160px; top: -80px; left: 800px; }
            .lace-bottom-center { width: 230px; height: 230px; bottom: -90px; left: 65%; transform: translateX(-10%); }
            .lace-bottom-right { width: 320px; height: 320px; bottom: -120px; right: -50px; }
            .container { max-width: 480px; margin-top: 40px; }
            .black-box { padding: 16px 20px; }
        }
        @media (max-width: 500px) { .lace-circle { display: none; } }
    </style>
</head>
<body>
    <!-- Круги -->
    <div class="lace-circle lace-top-1"></div>
    <div class="lace-circle lace-top-2"></div>
    <div class="lace-circle lace-top-3"></div>
    <div class="lace-circle lace-top-4"></div>
    <div class="lace-circle lace-top-5"></div>
    <div class="lace-circle lace-bottom-center"></div>
    <div class="lace-circle lace-bottom-right"></div>

    <div class="container">
        <h1>РЕГИСТРАЦИЯ</h1>
        <div class="black-box">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">{{ message }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            <form action="/register" method="post" id="register-form">
                <div class="form-group">
                    <label for="username">Имя пользователя</label>
                    <input type="text" id="username" name="username" placeholder="Введите имя" required>
                </div>
                <div class="form-group">
                    <label for="email">Почта</label>
                    <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Не менее 6 символов" required>
                </div>
            </form>
        </div>
        <button type="submit" form="register-form">Создать аккаунт</button>
    </div>
</body>
</html>
