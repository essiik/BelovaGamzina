<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacy intimacy</title>
    <link href="https://fonts.googleapis.com/css2?family=JejuMyeongjo&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JejuMyeongjo', 'Nanum Myeongjo', serif;
            background-color: #f8f8f8;
            color: #1a1a1a;
            line-height: 1.4;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .header {
            padding: 40px 0 20px;
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .brand {
            font-size: 36px;
            letter-spacing: 6px;
            font-weight: 400;
            flex-shrink: 0;
            margin-left: 40px;   /* сдвиг названия вправо */
        }

        .search-wrapper {
            flex-grow: 0;
            margin-right: auto;
            margin-left: 20px;   /* сдвиг поиска вправо */
        }
        .search-container {
            display: flex;
            align-items: center;
            background: white;
            border: 1px solid #ccc;
            border-radius: 40px;
            overflow: hidden;
            max-width: 380px;
            width: 100%;
        }
        .search-input-wrapper {
            position: relative;
            flex-grow: 1;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #888;
            pointer-events: none;
        }
        .search-input-wrapper input {
            width: 100%;
            padding: 8px 12px 8px 32px;
            font-size: 14px;
            font-family: inherit;
            border: none;
            outline: none;
            background: white;
        }
        .search-container button {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 13px;
            font-family: inherit;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 40px;
            margin: 3px;
        }
        .search-container button:hover {
            background: #333;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
        }
        .round-btn {
            width: 42px;
            height: 42px;
            background: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
            font-size: 20px;
            text-decoration: none;
        }
        .round-btn:hover {
            background: #333;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 20px 0 40px;
            flex-wrap: wrap;
        }

        .nav a {
            text-decoration: none;
            color: #1a1a1a;
            font-size: 16px;
            letter-spacing: 2px;
            transition: opacity 0.2s;
        }

        .nav a:hover {
            opacity: 0.6;
        }

        .hero {
            background: #e8e4df;
            text-align: center;
            padding: 60px 20px;
            margin-bottom: 60px;
            border-radius: 4px;
        }

        .hero h2 {
            font-size: 36px;
            font-weight: 400;
            margin-bottom: 15px;
            letter-spacing: 4px;
        }

        .categories {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 60px;
        }

        .category-item {
            border: 1px solid #ccc;
            border-radius: 40px;
            background: white;
            padding: 10px 30px;
            font-size: 16px;
            letter-spacing: 1px;
            color: #1a1a1a;
            transition: all 0.2s;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: 400;
        }

        .category-item:hover {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
        }

        .section-title {
            text-align: center;
            font-size: 28px;
            letter-spacing: 4px;
            margin: 60px 0 30px;
            font-weight: 400;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
            margin-bottom: 60px;
        }

        .product-card {
            background: white;
            text-align: center;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            margin-bottom: 15px;
            background: #f0f0f0;
        }

        .btn {
            background: #1a1a1a;
            color: white;
            border: none;
            padding: 8px 24px;
            font-size: 12px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
            margin-top: 10px;
        }

        .btn:hover {
            background: #333;
        }

        .banner {
            background: #1a1a1a;
            color: white;
            text-align: center;
            padding: 50px 20px;
            margin: 60px 0;
        }

        .banner h3 {
            font-size: 32px;
            font-weight: 400;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .banner p {
            font-size: 18px;
            opacity: 0.8;
        }

        .footer {
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid #ddd;
            margin-top: 60px;
            color: #666;
            font-size: 12px;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }
            .brand {
                text-align: center;
                font-size: 28px;
                letter-spacing: 4px;
                margin-left: 0;   /* убираем отступы на мобильных */
            }
            .search-wrapper {
                margin-left: 0;
                margin-right: 0;
                width: 100%;
            }
            .search-container {
                max-width: 100%;
            }
            .action-buttons {
                justify-content: center;
            }
            .nav {
                gap: 20px;
            }
            .hero h2 {
                font-size: 28px;
            }
            .product-grid {
                gap: 20px;
            }
            .category-item {
                padding: 6px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">LACY INTIMACY</div>
            <div class="search-wrapper">
                <div class="search-container">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" placeholder="Поиск...">
                    </div>
                    <button type="submit">Поиск</button>
                </div>
            </div>
            <div class="action-buttons">

            </div>
        </div>

        <div class="nav">

        </div>

        <div class="hero">

        </div>

        <div class="categories">
            <div class="category-item">Популярное</div>
            <div class="category-item">Новинки</div>

        <h2 class="section-title">СКИДКА</h2>
        <div class="product-grid">
            <div class="product-card">
                <img class="product-image" src="https://i.pinimg.com/736x/84/70/10/847010632c6b93c74b6ed22d1e89779e.jpg" alt="Product">
                <button class="btn">В КОРЗИНУ</button>
            </div>
            <div class="product-card">
                <img class="product-image" src="https://i.pinimg.com/736x/9c/a7/6b/9ca76b998adf2b0e767f06fb4a90efc5.jpg" alt="Product">
                <button class="btn">В КОРЗИНУ</button>
            </div>
            <div class="product-card">
                <img class="product-image" src="https://i.pinimg.com/736x/27/0c/46/270c467e2e931d386f5da635b02b83d1.jpg" alt="Product">
                <button class="btn">В КОРЗИНУ</button>
            </div>
            <div class="product-card">
                <img class="product-image" src="https://i.pinimg.com/736x/42/20/4b/42204b3a835d5e7f374dae947c4d9c89.jpg" alt="Product">
                <button class="btn">В КОРЗИНУ</button>
            </div>
        </div>

        <div class="banner">
            <h3>НОВАЯ КОЛЛЕКЦИЯ</h3>
            <p>Эксклюзивные модели с доставкой по всему миру</p>
        </div>

        <div class="product-grid">
            <div class="product-card">
                <img class="product-image" src="https://i.pinimg.com/1200x/2e/cb/a9/2ecba9c7450222dd51dba5281457d40e.jpg" alt="Product">
                <button class="btn">В КОРЗИНУ</button>
            </div>
            <div class="product-card">
                <img class="product-image" src="https://i.pinimg.com/736x/02/c5/37/02c537259ea2f7074797daaf74b1b16b.jpg" alt="Product">
                <button class="btn">В КОРЗИНУ</button>
            </div>
            <div class="product-card">
                <img class="product-image" src="https://i.pinimg.com/736x/ec/ae/e6/ecaee666c80a22fe02a5d2ce7fce7350.jpg" alt="Product">
                <button class="btn">В КОРЗИНУ</button>
            </div>
            <div class="product-card">
                <img class="product-image" src="https://i.pinimg.com/736x/ca/08/bc/ca08bcdae17b8db0f393dd36a642c980.jpg" alt="Product">
                <button class="btn">В КОРЗИНУ</button>
            </div>
        </div>

        <div class="footer">
            <p>© 2025 LACY INTIMACY. ALL RIGHTS RESERVED.</p>
        </div>
    </div>
</body>
</html>
